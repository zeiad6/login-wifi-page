<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<meta name="color-scheme" content="light">
<title>تم تسجيل الخروج | شبكة الباشا نت</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
:root{--ease:cubic-bezier(.22,1,.36,1);--gap:24px;--pad:clamp(16px,4vw,32px);--h1:clamp(1.85rem,5vw,2.6rem);--h1-weight:800;--h1-track:-.015em;--field-h:62px;--field-bw:1.5px;--btn-h:58px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;line-height:1.55;overflow-x:hidden;position:relative;text-rendering:optimizeLegibility}
body.modal-open{overflow:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.page{position:relative;z-index:1;width:100%;max-width:var(--page-max,1120px);margin:0 auto;padding:var(--pad);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:var(--gap)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;flex-shrink:0;display:block}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;direction:ltr}
.net{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;animation:pulse 2.4s var(--ease) infinite}
.net-ms{font-family:var(--font-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.stage{flex:1;display:grid;gap:var(--gap);align-content:center;grid-template-columns:minmax(0,1fr)}
.main-col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:960px){.stage{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(32px,5vw,72px)}}
.panel{position:relative;background:var(--surface);border:var(--panel-border,1px solid var(--line));border-radius:var(--radius);box-shadow:var(--panel-shadow,none)}
.panel-in{padding:clamp(24px,5vw,40px);border-radius:inherit}
h1{font-family:var(--font-display);font-size:var(--h1);line-height:1.15;font-weight:var(--h1-weight);letter-spacing:var(--h1-track)}
.lede{margin-top:10px;color:var(--muted);font-size:1.0625rem;max-width:40ch}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding:13px 15px;border-radius:var(--radius-sm);background:var(--danger-bg);color:var(--danger-ink);font-size:.9375rem;border:1px solid var(--danger-line);animation:rise .35s var(--ease) both}
.alert svg{width:19px;height:19px;flex-shrink:0;margin-top:2px;color:var(--danger)}
#loginForm{margin-top:28px;display:flex;flex-direction:column}
.field-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.9375rem;font-weight:700;margin-bottom:10px}
.count{font-size:.8125rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.field{position:relative;display:flex;align-items:center}
.field-input{width:100%;height:var(--field-h);background:var(--field-bg);color:var(--field-ink,var(--ink));border:var(--field-bw) solid var(--field-line);border-radius:var(--radius-sm);padding:0 18px;font-family:var(--font-num);font-size:1.55rem;font-weight:700;letter-spacing:.16em;direction:ltr;text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;transition:border-color .15s ease-out,box-shadow .25s var(--ease),background-color .25s,transform .25s var(--ease)}
.field-input::placeholder{color:var(--muted);opacity:.55;letter-spacing:.32em;font-weight:500}
.field-input:focus{outline:none;border-color:var(--accent-line,var(--accent));box-shadow:var(--focus-ring)}
.field-input.is-error{border-color:var(--danger);transition:border-color .28s ease-out}
.field-input.is-shaking{animation:shake .28s linear}
.field.has-paste .field-input{padding:0 18px 0 84px}
.paste{position:absolute;left:9px;height:42px;padding:0 14px;border-radius:var(--radius-xs,var(--radius-sm));background:var(--chip-bg);color:var(--chip-ink);font-size:.8125rem;font-weight:700;transition:transform .15s var(--ease),background-color .15s}
.paste:active{transform:scale(.95)}
.hint{margin-top:10px;font-size:.875rem;color:var(--muted)}
.submit{margin-top:24px;min-height:var(--btn-h);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.0625rem;border-radius:var(--btn-radius,var(--radius-sm));text-decoration:none;transition:transform .2s var(--ease),background-color .2s,box-shadow .2s,color .2s}
.submit svg{width:20px;height:20px;flex-shrink:0;transition:transform .3s var(--ease)}
.submit:hover:not(:disabled) svg{transform:translateX(-5px)}
.submit:active:not(:disabled){transform:scale(.98)}
.submit:disabled{cursor:progress;background:var(--busy-bg);color:var(--busy-ink);box-shadow:none}
.submit .spin{display:none;width:18px;height:18px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.submit.is-busy .spin{display:block}
.submit.is-busy svg{display:none}
.swap{animation:swap .25s ease-in-out both}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 14px;border-radius:var(--radius-sm);background:var(--surface-2);font-weight:700;font-size:.9375rem;transition:transform .2s var(--ease),background-color .2s,box-shadow .2s}
.action svg{width:18px;height:18px;color:var(--accent-2);flex-shrink:0}
.action:hover{background:var(--surface-3)}
.action:active{transform:scale(.97)}
.plans h2{font-family:var(--font-display);font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.plans-note{color:var(--muted);font-size:.9375rem;margin-top:4px}
.plan-list{list-style:none;display:flex;flex-direction:column;gap:var(--plan-gap,8px);margin-top:16px}
.plan{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;background:var(--surface-2);border-radius:var(--radius-sm);transition:transform .25s var(--ease),background-color .2s}
.plan{width:100%;text-align:start;cursor:pointer}
.plan:hover{background:var(--surface-3)}
.plan:active{transform:scale(.985)}
.plan-end{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.plan-rate{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan-name{display:block;font-weight:800;font-size:1rem}
.plan-meta{display:block;font-size:.875rem;color:var(--muted)}
.lead{display:none}
.plan-price{font-family:var(--font-num);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--price,var(--ink))}
.plan-price small{font-family:var(--font);font-size:.8125rem;font-weight:600;color:var(--muted);margin-inline-start:4px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font-size:.8125rem;color:var(--muted)}
.foot a{text-decoration:none;border-bottom:1px solid currentColor}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:600px){.modal{align-items:center;padding:24px}}
.modal-backdrop{position:absolute;inset:0;background:var(--scrim,rgba(0,0,0,.6));opacity:0;transition:opacity .25s var(--ease)}
.sheet{position:relative;width:100%;max-width:460px;max-height:86vh;overflow:auto;overscroll-behavior:contain;background:var(--surface-solid);color:var(--ink);border-radius:var(--radius);border:var(--sheet-border,0);box-shadow:var(--sheet-shadow,0 30px 80px rgba(0,0,0,.45));padding:22px;transform:scale(.96) translateY(12px);opacity:0;transition:transform .25s var(--ease),opacity .25s var(--ease)}
.modal.is-open .modal-backdrop{opacity:1}
.modal.is-open .sheet{transform:none;opacity:1}
.modal.is-closing .sheet,.modal.is-closing .modal-backdrop{transition-duration:.15s}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-head h2{font-family:var(--font-display);font-size:1.25rem;font-weight:800}
.close{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--surface-2);transition:background-color .15s,transform .15s var(--ease)}
.close:hover{background:var(--surface-3)}
.close:active{transform:scale(.94)}
.close svg{width:18px;height:18px}
.search{width:100%;height:48px;margin-bottom:12px;padding:0 16px;background:var(--field-bg);border:1.5px solid var(--field-line);border-radius:var(--radius-sm);color:var(--ink);font-size:1rem}
.search:focus{outline:none;border-color:var(--accent-line,var(--accent));box-shadow:var(--focus-ring)}
.pos-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.pos{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--surface-2);border-radius:var(--radius-sm)}
.pos h3{font-size:1rem;font-weight:800}
.pos p{font-size:.875rem;color:var(--muted)}
.pos .hours{color:var(--ink);opacity:.8}
.call{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink);transition:transform .15s var(--ease),filter .15s}
.call:hover{filter:brightness(1.08)}
.call:active{transform:scale(.94)}
.call svg{width:19px;height:19px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.9375rem}
.faq{margin-top:18px}
.faq h3{font-size:1rem;font-weight:800;margin-bottom:8px}
.faq ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.faq li{font-size:.9375rem;color:var(--muted);padding-inline-start:14px;position:relative}
.faq li::before{content:"";position:absolute;inset-inline-start:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--accent-2)}
.faq b{color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.stat{padding:14px 16px;background:var(--surface-2);border-radius:var(--radius-sm);min-width:0}
.stat dt{font-size:.8125rem;color:var(--muted)}
.stat dd{font-family:var(--font-num);font-weight:800;font-size:1.0625rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;overflow-wrap:anywhere}
.stat.wide{grid-column:1/-1}
.stat.hero dd{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.15;color:var(--price,var(--ink))}
.who{direction:ltr;unicode-bidi:isolate;font-family:var(--font-num);font-weight:800;color:var(--ink)}
.btn-ghost{margin-top:12px;min-height:52px;width:100%;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--btn-radius,var(--radius-sm));border:1.5px solid var(--danger-line);background:transparent;color:var(--danger-ink);font-weight:700;font-size:1rem;transition:background-color .2s,transform .2s var(--ease)}
.btn-ghost:hover{background:var(--danger-bg)}
.btn-ghost:active{transform:scale(.98)}
.progress{height:4px;margin-top:22px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent-2);transform-origin:right;animation:fill 2s linear both}
.done-mark{width:56px;height:56px;margin-bottom:18px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink)}
.done-mark svg{width:28px;height:28px}
.check-path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .2s var(--ease) forwards}
.solo{max-width:560px;width:100%;margin-inline:auto}
.is-solo .stage{grid-template-columns:minmax(0,1fr)}
.rise{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i,0) * 80ms)}
.ticker{display:flex;align-items:stretch;min-height:48px;overflow:hidden;background:var(--tk-bg,var(--surface-2));color:var(--tk-ink,var(--ink));border:var(--tk-border,0);border-radius:var(--tk-radius,var(--radius-sm));box-shadow:var(--tk-shadow,none)}
.ticker-track{flex:1;min-width:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;text-align:start;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.ticker-run{display:inline-flex;align-items:center;animation:tick 32s linear infinite;font-weight:700;font-size:.9375rem}
.ticker-run span{padding-inline:14px}
.ticker-run b{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--tk-price,var(--price,var(--ink)));margin-inline-start:6px}
.ticker-run i{width:5px;height:5px;flex-shrink:0;border-radius:50%;background:var(--tk-dot,var(--accent-2))}
.ticker:hover .ticker-run,.ticker:focus-within .ticker-run,.ticker.is-paused .ticker-run{animation-play-state:paused}
.ticker-cta{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:0 16px;background:var(--tk-cta-bg,var(--accent));color:var(--tk-cta-ink,var(--accent-ink));border-radius:var(--tk-cta-radius,0);font-weight:800;font-size:.875rem;transition:filter .15s,transform .15s var(--ease)}
.ticker-cta:hover{filter:brightness(1.1)}
.ticker-cta:active{transform:scale(.96)}
.ticker-cta svg{width:16px;height:16px}
@keyframes tick{to{transform:translateX(50%)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(4px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes shake{0%{transform:translateX(0)}28.57%{transform:translateX(6px)}57.14%{transform:translateX(-6px)}78.57%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ── Neo-Brutalist ── */
:root{--tk-bg:#000;--tk-ink:#ffd400;--tk-price:#fff;--tk-border:3px solid #000;--tk-shadow:5px 5px 0 #000;--tk-cta-bg:#ff4d8d;--tk-cta-ink:#000;--tk-dot:#ff4d8d;--bg:#ffd400;--ink:#000;--muted:#262626;--surface:#fff;--surface-solid:#fff;--surface-2:#fff;--surface-3:#ffe0ec;--line:#000;--accent:#ff4d8d;--accent-ink:#000;--accent-2:#000;--accent-line:#000;--ok:#00b84a;--focus:#000;--danger:#e00000;--danger-bg:#ffe1e1;--danger-ink:#000;--danger-line:#000;--field-bg:#fff;--field-line:#000;--field-bw:3px;--focus-ring:5px 5px 0 #000;--chip-bg:#000;--chip-ink:#ffd400;--busy-bg:#d4d4d4;--busy-ink:#000;--radius:0;--radius-sm:0;--font:system-ui,-apple-system,"Segoe UI","SF Arabic","Noto Sans Arabic",Tahoma,sans-serif;--font-display:"Noto Kufi Arabic","Segoe UI",system-ui,"Noto Sans Arabic",Tahoma,sans-serif;--font-num:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;--h1:clamp(2.2rem,7vw,3.6rem);--h1-weight:900;--price:#ffd400;--panel-border:3px solid #000;--panel-shadow:10px 10px 0 #000;--sheet-border:3px solid #000;--sheet-shadow:10px 10px 0 #000;--scrim:rgba(0,0,0,.55)}
body{background-image:radial-gradient(rgba(0,0,0,.14) 1.2px,transparent 1.4px);background-size:16px 16px}
.dot{border-radius:0;outline:2px solid #000}
.ticker{transform:rotate(-1deg);font-family:"Noto Kufi Arabic","Segoe UI",system-ui,"Noto Sans Arabic",Tahoma,sans-serif}
.ticker-cta{border-inline-start:3px solid #000}
.net{color:#000;font-weight:700}
.field-input:focus{transform:translate(-3px,-3px)}
.submit,.action,.plan,.pos,.call,.close,.paste,.alert,.search,.stat,.btn-ghost{border:3px solid #000}
.submit{box-shadow:6px 6px 0 #000;font-size:1.25rem;font-weight:900}
.submit:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:8px 8px 0 #000}
.submit:active:not(:disabled){transform:translate(6px,6px);box-shadow:0 0 0 #000}
.action,.plan{box-shadow:5px 5px 0 #000}
.action:hover,.plan:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000;background:#fff}
.action:active{transform:translate(5px,5px);box-shadow:none}
.plans h2{font-size:1.7rem;font-weight:900}
.plans-note{color:#000}
.plan-price{background:#000;color:#ffd400;padding:5px 12px;transform:rotate(-3deg)}
.plan-price small{color:#ffd400}
.call{background:#ffd400;color:#000}
.btn-ghost{color:#000;background:#fff;box-shadow:5px 5px 0 #000}
.done-mark{border:3px solid #000;box-shadow:5px 5px 0 #000}
</style>
</head>
<body class="theme-neo-brutalist is-solo">
<div class="bg" aria-hidden="true"></div>
<div class="page">
<header class="topbar rise" style="--i:0">
  <div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="8" width="52" height="52" fill="#000"/><rect x="4" y="4" width="52" height="52" fill="#fff" stroke="#000" stroke-width="3"/><path d="M14 38l-2-17 9.5 7.5L29 16l7.5 12.5L46 21l-2 17z" transform="translate(-1 -1)" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="square" stroke-linejoin="miter"/></svg><span class="brand-name">El Basha</span></div>
  <span class="net"><span class="dot" aria-hidden="true"></span><span>شبكة الباشا نت</span><span class="net-ms" id="netMs" hidden></span></span>
</header>
<div class="stage"><main class="panel solo rise" style="--i:1"><div class="panel-in">
    <h1>تم تسجيل الخروج</h1>
    <p class="lede">فُصل الجهاز بأمان. ما تبقى من باقة الكرت <span class="who">$(username)</span> محفوظ لك.</p>
    <dl class="stats">
      <div class="stat"><dt>مدة الجلسة</dt><dd>$(uptime)</dd></div>
      <div class="stat"><dt>التنزيل</dt><dd>$(bytes-out-nice)</dd></div>
    </dl>
    <a href="$(link-login)" class="submit"><span>الدخول مرة أخرى</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
</div></main></div>
<footer class="foot rise" style="--i:2"><span>الباشا نت · إنترنت لاسلكي بالكروت</span><span>الدعم: <a href="tel:777000000" dir="ltr">777 000 000</a></span></footer>

</div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var openEl=null,lastFocus=null;
function focusables(m){return m.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden])')}
function openModal(id){var m=$(id);if(!m)return;lastFocus=document.activeElement;m.hidden=false;void m.offsetWidth;m.classList.add('is-open');document.body.classList.add('modal-open');openEl=m;var c=m.querySelector('.close');setTimeout(function(){c&&c.focus()},60)}
function closeModal(){if(!openEl)return;var m=openEl;openEl=null;m.classList.remove('is-open');m.classList.add('is-closing');document.body.classList.remove('modal-open');setTimeout(function(){m.classList.remove('is-closing');m.hidden=true},160);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-open],[data-close]');if(!t)return;if(t.hasAttribute('data-open'))openModal(t.getAttribute('data-open'));else closeModal()});
document.addEventListener('keydown',function(e){
 if(!openEl)return;
 if(e.key==='Escape'||e.key==='Esc'){closeModal();return}
 if(e.key!=='Tab')return;
 var f=focusables(openEl);if(!f.length)return;
 var first=f[0],last=f[f.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
// One request only: the router's firewall bans IPs that open too many new HTTP connections per minute.
var ms=$('netMs');
if(ms&&window.fetch&&/^https?:$/.test(location.protocol)){
 var t0=Date.now();
 fetch(location.pathname+'?rtt='+t0,{method:'HEAD',cache:'no-store'}).then(function(){ms.textContent=(Date.now()-t0)+'ms';ms.hidden=false}).catch(function(){});
}
})();
</script>
</body>
</html>
