<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="الباشا نت - El Basha Net">
  <defs>
    <linearGradient id="eb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset=".45" stop-color="#d4a945"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="eb-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16130e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="520" height="160" rx="28" fill="url(#eb-ink)"/>
  <rect x="6" y="6" width="508" height="148" rx="23" fill="none" stroke="url(#eb-gold)" stroke-opacity=".35"/>

  <!-- الشعار: معيّن مزدوج (الفخامة) يحتضن تاجاً بثلاث قمم، وثلاثة خطوط مائلة خلفه (السرعة) -->
  <g transform="translate(30 16)">
    <path d="M64 2L126 64 64 126 2 64z" fill="none" stroke="url(#eb-gold)" stroke-width="3"/>
    <path d="M64 14L114 64 64 114 14 64z" fill="#0b0a08" stroke="url(#eb-gold)" stroke-width="1.2" stroke-opacity=".6"/>
    <g stroke="url(#eb-gold)" stroke-width="3.2" stroke-linecap="round" opacity=".55">
      <path d="M26 58h14"/><path d="M22 66h18"/><path d="M26 74h14"/>
    </g>
    <path d="M42 80l-4-28 14 11 12-20 12 20 14-11-4 28z" fill="url(#eb-gold)"/>
    <path d="M42 86h44" stroke="url(#eb-gold)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="40" r="3.4" fill="#f6e3a1"/>
  </g>

  <!-- الاسم العربي والإنجليزي -->
  <text x="490" y="84" text-anchor="end" direction="rtl" font-family="'Noto Kufi Arabic','Segoe UI','Tahoma',sans-serif" font-size="52" font-weight="800" fill="url(#eb-gold)">الباشا نت</text>
  <text x="490" y="124" text-anchor="end" font-family="Didot,'Bodoni 72',Georgia,serif" font-size="20" letter-spacing="9" fill="#d4a945">EL BASHA NET</text>
</svg>
